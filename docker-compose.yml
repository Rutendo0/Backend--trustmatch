version: '3.8'

services:
  # Main Node.js Backend
  api:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai:5000/verify
    depends_on:
      ai:
        condition: service_healthy


  # Python AI Service
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
    volumes:
      - deepface_weights:/root/.deepface/weights
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  deepface_weights:
